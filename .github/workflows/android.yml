name: Android Build
on:
  push:
    branches: [main, custom]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testOssDebugUnitTest
      - name: Build OSS debug APK
        run: ./gradlew --no-daemon assembleOssDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: safetube-debug-apk
          path: app/build/outputs/apk/oss/debug/*.apk
      - name: Verify APK (no LeakCanary, app name, signer)
        run: |
          APK=$(ls app/build/outputs/apk/oss/debug/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "leakcanary entries: $(unzip -l "$APK" | grep -ci leakcanary)"
          $BT/aapt2 dump badging "$APK" | grep -E "^package|application-label:|launchable-activity" 
          $BT/apksigner verify --print-certs "$APK" | grep -E "SHA-256|Signer #1 certificate DN"
      - name: Publish APK as a release (plain .apk, no zip)
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/oss/debug/*.apk SafeTube-debug.apk
          gh release create "${{ github.ref_name }}-${{ github.run_number }}" SafeTube-debug.apk \
            --title "SafeTube (${{ github.ref_name }}) build ${{ github.run_number }}" \
            --notes "Debug build of commit ${{ github.sha }}. Not fully tested."

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: safetube-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/emu_test.sh
      - name: Save screenshots and logs to branch "shots"
        if: always()
        run: |
          cd shots && git init -q && git checkout -q -b shots
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "emulator run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots
